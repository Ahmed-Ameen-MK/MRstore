<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>تفاصيل المنتج | MR store</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/home.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
  <div class="header-in">
    <a href="index.html" class="brand"><img src="icon.png" alt="MR"><span>MR store</span></a>
    <span class="sp"></span>
    <div class="auth-area" id="authArea"></div>
  </div>
</header>

<div id="view"><div class="dt"><div class="skeleton" style="aspect-ratio:1/1;height:auto"></div><div class="skeleton" style="height:320px"></div></div></div>

<script src="js/common.js"></script>
<script src="js/site.js"></script>
<script>
const view = document.getElementById("view");
const param = new URLSearchParams(location.search).get("title") || "";

function notFound(msg){
  view.innerHTML = `<div class="dt" style="grid-template-columns:1fr"><div class="empty">${msg}<br><br><a class="btn primary" href="index.html">العودة إلى المتجر</a></div></div>`;
}

function relCard(p){
  return `<a class="card glass tilt reveal" href="details.html?title=${encodeURIComponent(slug(p.title))}">
    <div class="thumb"><img loading="lazy" src="${escapeHtml(p.avatar_url || "icon.png")}" alt="${escapeHtml(p.title)}" onerror="this.src='icon.png'"></div>
    <div class="info"><h4>${escapeHtml(p.title)}</h4><div class="price">${escapeHtml(p.price)} ${CURRENCY}</div></div></a>`;
}

(async function(){
  initSite();
  if (!param) return notFound("لم يتم تحديد المنتج.");
  const { data, error } = await sb.from("store").select("*").order("id", { ascending: false });
  if (error) return notFound("تعذر تحميل المنتج: " + escapeHtml(error.message));
  const key = slug(param);
  const p = (data || []).find(x => slug(x.title) === key);
  if (!p) return notFound("هذا المنتج غير موجود أو تم حذفه.");

  document.title = p.title + " | MR store";
  const cat = String(p.category ?? "").trim() || "غير مصنف";
  const rel = (data || []).filter(x => x.id !== p.id && (String(x.category ?? "").trim() || "غير مصنف") === cat).slice(0, 4);

  view.innerHTML = `
    <div class="crumb"><a href="index.html">المتجر</a> / <span>${escapeHtml(cat)}</span> / <span>${escapeHtml(p.title)}</span></div>
    <div class="dt">
      <div class="dt-img glass reveal"><img src="${escapeHtml(p.avatar_url || "icon.png")}" alt="${escapeHtml(p.title)}" onerror="this.src='icon.png'"></div>
      <div class="dt-info reveal">
        <span class="tagc" style="align-self:flex-start;background:rgba(10,10,11,.7);border:1px solid var(--line);color:var(--silver);padding:2px 12px;border-radius:999px;font-size:.8rem">${escapeHtml(cat)}</span>
        <h1>${escapeHtml(p.title)}</h1>
        <div class="price">${escapeHtml(p.price)} ${CURRENCY}</div>
        <div class="desc">${escapeHtml(p.description)}</div>
        <div class="dt-btns">
          <button class="btn primary" id="buyBtn">شراء</button>
          <a class="btn" href="index.html">متابعة التسوق</a>
        </div>
      </div>
    </div>
    ${rel.length ? `<section class="related"><h2 class="sec-title">منتجات مشابهة</h2><div class="grid">${rel.map(relCard).join("")}</div></section>` : ""}`;
  observeReveal(view);

  /* ====== الشراء ====== */
  const ZIINA = "https://pay.ziina.com/ar/N7311", DISCORD = "https://discord.gg/mrr";
  const logo = (file, alt) => `<img src="img/${file}" alt="${alt}" onerror="this.replaceWith(document.createTextNode('${alt}'))">`;

  /* آخر عملية لهذا المنتج بحالة none فقط = جاري التحقق (red / green = تبدأ الخطوة الأولى من جديد) */
  async function hasPending(){
    const rows = await rpcUser("mr_my_payments") || [];
    const last = rows.find(r => r.product === p.title);   // مرتبة من الأحدث
    return !!last && last.status === "none";
  }

  function showSteps(paid){
    const back = modal("كيفية الشراء", `
      <div class="pstep ${paid ? "wait" : "cur"}">
        <div class="pnum">${paid ? "⏳" : "1"}</div>
        <div class="pbody">
          <h4>التوجه للدفع</h4>
          ${paid
            ? '<p>جاري التحقق من الدفع... يمكنك الآن الانتقال للخطوة التالية.</p><button type="button" class="linkbtn" id="payRetry">لم يكتمل الدفع؟ أعد المحاولة</button>'
            : `<p>ادفع قيمة المنتج بأمان عبر Ziina.</p>
               <button type="button" class="btn primary block pay-ziina" id="payBtn"><span>دفع باستخدام Ziina</span><span class="logos">${logo("ziina.png", "Ziina")}${logo("gpay.png", "Google Pay")}${logo("applepay.png", "Apple Pay")}</span></button>
               <div class="msg" id="payMsg" style="margin:8px 0 0"></div>`}
        </div>
      </div>
      <div class="pstep ${paid ? "cur" : "lock"}">
        <div class="pnum">2</div>
        <div class="pbody">
          <h4>استلام المنتج</h4>
          <p>توجه إلى متجرنا على ديسكورد وافتح تذكرة استلام منتج.</p>
          ${paid ? `<a class="btn primary block" href="${DISCORD}" target="_blank" rel="noopener">فتح تذكرة منتج</a>` : '<button type="button" class="btn block" disabled>فتح تذكرة منتج</button>'}
        </div>
      </div>`);
    const payBtn = back.querySelector("#payBtn"), retry = back.querySelector("#payRetry");
    if (payBtn) payBtn.onclick = async () => {
      const msg = back.querySelector("#payMsg");
      payBtn.disabled = true; showMsg(msg, "جاري تسجيل العملية...");
      try {
        await rpcUser("mr_create_payment", { p_product: p.title });   // صف جديد status = none
        try { sessionStorage.setItem("mr_pay_ret", String(p.id)); } catch {}
        location.href = ZIINA;
      } catch (e) {
        showMsg(msg, "تعذر بدء الدفع: " + (e.message || e), "err");
        payBtn.disabled = false;
      }
    };
    if (retry) retry.onclick = () => showSteps(false);
  }

  const buyBtn = document.getElementById("buyBtn");
  buyBtn.onclick = async () => {
    const u = getUser();
    if (!u || !u.h){
      modal("شراء", `<div class="chat-empty">سجّل الدخول لإتمام عملية الشراء.<br>
        <a class="btn primary" href="auth/login.html">تسجيل الدخول</a> <a class="btn" href="auth/register.html">إنشاء حساب</a></div>`);
      return;
    }
    buyBtn.disabled = true;
    let pending = false;
    try { pending = await hasPending(); } catch {}
    buyBtn.disabled = false;
    if (pending) return showSteps(true);
    const back = modal("شراء", '<div class="chat-empty" style="font-size:1.05rem;color:var(--text)">هل تريد إتمام الدفع؟</div>',
      '<div class="row" style="margin-top:0"><button type="button" class="btn" id="buyNo">لا</button><button type="button" class="btn primary" id="buyYes">نعم</button></div>');
    back.querySelector("#buyNo").onclick = closeModal;
    back.querySelector("#buyYes").onclick = () => showSteps(false);
  };

  /* الرجوع من صفحة الدفع: تُفتح النافذة تلقائياً إن كانت العملية بانتظار التحقق */
  async function showIfReturned(){
    let r = false;
    try { r = sessionStorage.getItem("mr_pay_ret") === String(p.id); if (r) sessionStorage.removeItem("mr_pay_ret"); } catch {}
    if (!r) return;
    let pend = true;
    try { pend = await hasPending(); } catch {}
    if (pend) showSteps(true);
  }
  showIfReturned();
  addEventListener("pageshow", e => { if (e.persisted) showIfReturned(); });
})();
</script>
</body>
</html>
