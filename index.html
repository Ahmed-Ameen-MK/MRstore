<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>MR store</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/home.css">
<script>try{if(sessionStorage.getItem("mr_intro"))document.documentElement.classList.add("no-intro")}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="intro" aria-label="MR store">
  <div class="intro-bg"></div>
  <img class="intro-logo" src="icon.png" alt="MR store" draggable="false">
  <div class="typed"><span id="introText"></span><span class="caret"></span></div>
  <button type="button" class="skip-btn" id="introSkip">تخطي</button>
</div>

<div class="newsbar" id="newsBar" hidden>
  <div class="nb-viewport" id="nbView"><div class="nb-track" id="nbTrack"></div></div>
  <button class="nb-x" id="nbClose" aria-label="إغلاق الشريط">×</button>
</div>

<header class="header">
  <div class="header-in">
    <button class="menu-btn" id="menuBtn" aria-label="التصنيفات">☰</button>
    <a href="index.html" class="brand"><img src="icon.png" alt="MR"><span>MR store</span></a>

    <div class="search">
      <input id="q" type="search" placeholder="ابحث في المنتجات..." autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>

    <div class="auth-area" id="authArea"></div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>التصنيفات</h3>
    <div id="cats"></div>
  </aside>

  <main class="content">
    <section id="secAll">
      <div class="bar">
        <h2 id="title">كل المنتجات</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="more-wrap" id="moreWrap" hidden><button class="btn" id="moreBtn">عرض المزيد</button></div>
    </section>

    <section class="home-sec" id="secSlider" hidden>
      <h2 class="sec-title">عرض مميز</h2>
      <div class="slider" id="slider"></div>
      <div class="dots" id="dots"></div>
    </section>

    <section class="home-sec" id="secRandom" hidden>
      <h2 class="sec-title">منتجات مختارة لك</h2>
      <div class="grid" id="randGrid"></div>
    </section>
  </main>
</div>

<div class="p-actions" id="pActions">
  <a href="details.html" aria-label="عرض التفاصيل" title="عرض"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></a>
  <a href="details.html" aria-label="شراء" title="شراء"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.2 11h9.6l2-8H6.3"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/></svg></a>
</div>

<script src="js/common.js"></script>
<script src="js/site.js"></script>
<script src="js/home.js"></script>
<script src="js/intro.js"></script>
</body>
</html>
