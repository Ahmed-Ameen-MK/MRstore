<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">
<title>404 | الصفحة غير موجودة - MR store</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Cairo",system-ui,sans-serif;min-height:100vh;color:#ececee;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(900px 500px at 70% -10%,#2a2b31,transparent 60%),radial-gradient(800px 500px at -10% 110%,#1e1f23,transparent 60%),#0a0a0b;
  }
  .box{max-width:460px;width:100%}
  .logo{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:block;box-shadow:0 0 50px rgba(200,204,212,.18)}
  h1{
    font-size:clamp(5.5rem,24vw,9rem);font-weight:900;line-height:1;letter-spacing:4px;
    background:linear-gradient(180deg,#fff 10%,#6d7078);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
  }
  h2{font-size:1.5rem;margin:6px 0 8px}
  p{color:#9a9ca3;margin-bottom:26px}
  a{
    display:inline-block;padding:12px 30px;border-radius:12px;font-weight:700;text-decoration:none;color:#101012;
    background:linear-gradient(180deg,#e9ebee,#aeb1b8);border:1px solid #d8dade;transition:.18s;
  }
  a:hover{filter:brightness(1.1);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/icon.png" alt="MR store" onerror="this.style.display='none'">
    <h1>404</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>الرابط الذي تحاول فتحه غير صحيح، أو لا تملك صلاحية الدخول إليه.</p>
    <a href="/">العودة إلى المتجر</a>
  </div>
</body>
</html>
